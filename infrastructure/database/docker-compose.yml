services:
  postgres:
    image: postgres:16-alpine
    container_name: petamparo-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-petamparo}
      POSTGRES_USER: ${DB_USERNAME:-petamparo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-petamparo_local}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-petamparo} -d ${DB_NAME:-petamparo}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - petamparo_postgres_data:/var/lib/postgresql/data

volumes:
  petamparo_postgres_data:
